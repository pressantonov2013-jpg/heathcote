<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бюро Хитхоут</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: one playful single-column game, each task has its own saturated colour field; white cards with hard ink outlines and offset shadows. */
:root{
  --ink:#1B1340;
  --white:#FFFFFF;
  --purple:#6C2BD9;
  --yellow:#FFD23F;
  --pink:#FF5C8A;
  --blue:#3D5AFE;
  --green:#2EE59D;
  --orange:#FF7A1A;
  --soft:#F3EEFF;
  --bg:#6C2BD9;
  --on:#FFFFFF;
  --f-display:'Unbounded','Arial Black',Arial,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
body[data-lv="0"],body[data-lv="6"]{--bg:var(--purple);--on:#FFFFFF}
body[data-lv="1"]{--bg:var(--yellow);--on:var(--ink)}
body[data-lv="2"]{--bg:var(--pink);--on:var(--ink)}
body[data-lv="3"]{--bg:var(--blue);--on:#FFFFFF}
body[data-lv="4"]{--bg:var(--green);--on:var(--ink)}
body[data-lv="5"]{--bg:var(--orange);--on:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--on);font-family:var(--f-body);font-size:18px;line-height:1.45;transition:background .35s}
.wrap{max-width:700px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:1px}
.meta{display:flex;align-items:center;gap:14px;font-weight:800;font-size:16px}
.pips{display:flex;gap:6px}
.pip{display:block;width:14px;height:14px;border-radius:50%;border:3px solid var(--on)}
.pip.done{background:var(--on)}
.pip.cur{width:26px;border-radius:999px;background:var(--on)}
.card{background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--ink);padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{margin:0;font-weight:800;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--purple)}
.count{margin:0;font-weight:700;font-size:15px;color:#5B5380}
h1,h2{margin:0;font-family:var(--f-display);text-wrap:balance;overflow-wrap:break-word}
h1{font-weight:900;font-size:clamp(38px,11vw,62px);line-height:1.02}
h2{font-weight:700;font-size:clamp(22px,5.6vw,29px);line-height:1.2}
h1:focus,h2:focus{outline:none}
.lead{margin:0;font-size:18px}
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}.polaroid{max-width:260px}}
.polaroid{background:var(--white);border:3px solid var(--ink);padding:10px 10px 12px;transform:rotate(-3deg);box-shadow:5px 5px 0 var(--ink);margin:6px}
.polaroid img{display:block;width:100%;height:auto;border:2px solid var(--ink)}
.cap{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.3;text-align:center;padding-top:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;background:var(--yellow)}
.btn{font-family:var(--f-body);font-weight:800;font-size:18px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:14px 24px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;align-self:flex-start;transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.alt{background:var(--pink)}
.btn.big{flex:1 1 140px;font-size:22px;padding:18px 24px;text-align:center}
.btn.right,.opt.right{background:var(--green)}
.btn.wrong,.opt.wrong{background:var(--pink)}
.btn:focus-visible,.opt:focus-visible,.segb:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font-family:var(--f-body);font-weight:700;font-size:18px;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:13px 18px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;transition:background .12s}
.opt:hover:not(:disabled){background:var(--soft)}
.opt[aria-pressed="true"]{background:var(--yellow)}
.opt:disabled{cursor:default}
.opt .badge{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:var(--white)}
.fb{border:3px solid var(--ink);border-radius:20px;background:var(--soft);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.fb p{margin:0}
.fb strong{font-weight:800}
.srow{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.srow p{margin:0;font-weight:700}
.srow.ok{background:#CFFBE6}
.srow.bad{background:#FFD3E0}
.srow .why{font-weight:500;font-size:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.segb{font-family:var(--f-body);font-weight:800;font-size:16px;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--yellow)}
.segb:disabled{cursor:default}
.group{display:flex;flex-direction:column;gap:10px}
.group h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big-score{font-family:var(--f-display);font-weight:900;font-size:clamp(54px,16vw,88px);line-height:1}
.big-score small{font-size:.35em;font-weight:700}
.title-badge{align-self:flex-start;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,4.6vw,24px);background:var(--green);border:3px solid var(--ink);border-radius:18px;padding:10px 16px;transform:rotate(-1.5deg)}
.recap{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.recap li{display:flex;gap:12px;align-items:baseline}
.recap b{font-family:var(--f-display);font-size:15px;flex:none;min-width:11ch}
.share{width:100%;min-height:112px;font-family:var(--f-body);font-size:16px;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:12px;resize:vertical}
.src{margin:0;font-size:14px;color:#5B5380}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:3px solid var(--ink);border-radius:18px;padding:12px;background:var(--yellow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,9vw,44px);line-height:1}
.tile span{font-size:14px;font-weight:700;line-height:1.25}
.quote{margin:0;background:var(--ink);color:#FFFFFF;border-radius:22px;padding:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,4.8vw,23px);line-height:1.3;display:flex;flex-direction:column;gap:12px}
.quote cite{font-family:var(--f-body);font-style:normal;font-weight:500;font-size:15px;line-height:1.4;color:#E6DDFB}
.idea{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.idea b{font-family:var(--f-display);font-size:16px;font-weight:700}
.fact{background:var(--yellow);border:3px solid var(--ink);border-radius:18px;padding:14px 16px}
.fact b{display:block;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}
.tip{margin:0;font-weight:700;font-size:16px;background:var(--soft);border-radius:14px;padding:10px 14px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{display:block;width:12px;height:12px;border-radius:50%;border:3px solid var(--ink)}
.dot.on{background:var(--ink)}
.bar{flex:1 1 120px;min-width:80px;max-width:260px;height:14px;border:3px solid var(--on);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--on);transition:width .3s}
.when{margin:0;align-self:flex-start;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--ink);color:#FFFFFF;border-radius:999px;padding:8px 16px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.btn.ghost{background:var(--white);font-size:16px;padding:10px 18px}
.promo{background:var(--ink);color:#FFFFFF;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.promo h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,5.4vw,26px);line-height:1.15;color:var(--yellow)}
.promo p{margin:0;font-size:17px}
.promo .btn{border-color:#FFFFFF;box-shadow:4px 4px 0 #FFFFFF}
.promo .btn:hover:not(:disabled){box-shadow:6px 6px 0 #FFFFFF}
.promo .btn:focus-visible{outline-color:var(--yellow)}
.clips{display:flex;flex-direction:column;gap:22px;padding-top:8px}
.clip{position:relative;margin:0;border:3px solid var(--ink);padding:22px 20px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 5px 0 var(--ink);background:#FFF3B0}
.clip:nth-child(odd){transform:rotate(-1deg)}
.clip:nth-child(even){transform:rotate(1deg);background:#FFD6E5}
.clip:nth-child(3n){background:#D5E3FF}
.clip::before{content:"";position:absolute;top:-14px;left:50%;width:84px;height:26px;margin-left:-42px;background:rgba(108,43,217,.4);transform:rotate(-3deg)}
.clip q{quotes:none;font-family:var(--f-display);font-weight:700;font-size:clamp(17px,4.6vw,21px);line-height:1.3;overflow-wrap:break-word}
.clip cite{font-style:normal;font-weight:700;font-size:14px;color:#4A4170}
.clip .note{margin:0;font-size:15px;font-weight:600}
.more{display:flex;flex-direction:column;gap:10px;border:3px solid var(--ink);border-radius:18px;padding:14px 16px;background:var(--white)}
.more b,.use b{display:block;font-size:13px;letter-spacing:1.2px;text-transform:uppercase}
.more p{margin:0;font-size:17px}
.use{background:var(--green);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font-weight:700;font-size:16px}
.card{overflow:hidden}
.choose{margin:6px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,5.4vw,26px);line-height:1.15}
.picks{display:flex;flex-direction:column;gap:14px}
.pick{font-family:var(--f-body);text-align:left;color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:16px 18px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.pick.p1{background:var(--yellow)}
.pick.p2{background:var(--green)}
.pick b{font-family:var(--f-display);font-weight:900;font-size:clamp(18px,4.8vw,22px);line-height:1.15}
.pick span{font-weight:700;font-size:16px;line-height:1.35}
.pick:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--ink)}
.pick:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pick:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.mot{margin:0;font-weight:800;font-size:15px;color:var(--purple)}
.hint{border:3px dashed var(--ink);border-radius:16px;padding:10px 14px;background:var(--soft);font-weight:700;font-size:16px}
.hint b{display:block;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px}
.praise{margin:0;font-weight:800;font-size:18px}
.cnt{margin:0;font-size:13px;font-weight:600;color:#7A7299;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var COLORS=[3,4,5,2,1];
var OK=['Верно!','В точку!','Именно так!','Отлично!'];

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function paint(n){document.body.setAttribute('data-lv',String(n))}
function add(n){S.score+=n;SCORE.textContent=S.score}
function put(html){
  ROOT.innerHTML=html;
  var h=ROOT.querySelector('h1,h2');
  if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true})}catch(e){}}
  try{window.scrollTo(0,0)}catch(e){}
}
function lc(t){return t.charAt(0)==='«'?t:t.charAt(0).toLowerCase()+t.slice(1)}
function shuffle(n){
  var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);
  for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function mot(i,n){
  if(n-i===1)return 'Последний вопрос. Вы почти у цели!';
  if(i===0)return 'Поехали! Ошибаться не страшно: после каждого ответа вас ждёт настоящий факт.';
  if(i/n<0.4)return 'Хороший темп: впереди ещё много интересного.';
  if(i/n<0.7)return 'Больше половины позади. Дальше самое вкусное!';
  return 'Финиш уже виден, держитесь!';
}

/* ---------- Счётчик прошедших (бесплатный сервис Abacus, работает и на GitHub Pages) ---------- */
var ABACUS='https://abacus.jasoncameron.dev';
var NS='lingvapolka-heathcote-9f3a2c';
var MIN_SHOW=10;
function who(n){var a=n%100,b=n%10;return (b>=2&&b<=4&&!(a>=12&&a<=14))?'человека':'человек'}
function paintCount(total){
  var el=document.getElementById('cnt');
  if(!el||typeof total!=='number'||total<MIN_SHOW)return;
  el.textContent='Тест уже прошли: '+total.toLocaleString('ru-RU')+' '+who(total);
  el.hidden=false;
}
function one(act,key){
  return fetch(ABACUS+'/'+act+'/'+NS+'/'+key+'-done',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():{value:0}})
    .then(function(d){return typeof d.value==='number'?d.value:0})
    .catch(function(){return -1});
}
function loadCount(){
  if(!window.fetch||!window.Promise)return;
  Promise.all([one('get','fun'),one('get','pro')]).then(function(v){
    if(v[0]<0||v[1]<0)return;
    paintCount(v[0]+v[1]);
  });
}
function reportDone(key){
  if(!window.fetch||!window.Promise)return;
  var k='hh_done_'+key,seen=false;
  try{seen=!!localStorage.getItem(k)}catch(e){}
  if(seen){loadCount();return}
  one('hit',key).then(function(v){
    if(v<0)return;
    try{localStorage.setItem(k,'1')}catch(e){}
    loadCount();
  });
}

/* ---------- Слайд 1 ---------- */
function intro(){
  S.score=0;SCORE.textContent='0';TOP.hidden=true;paint(0);
  put('<section class="card">'+
    '<div class="hero">'+
      '<div class="polaroid"><img alt="Портрет улыбающейся пожилой женщины с седыми волосами" src="'+PHOTO+'"><div class="cap">Дороти Хитхоут<br>1926–2011</div></div>'+
      '<div style="display:flex;flex-direction:column;gap:14px;min-width:0">'+
        '<p class="eyebrow">Легенда педагогики</p>'+
        '<h1>Дороти Хитхоут</h1>'+
        '<p class="lead">Пять лет она ткала на шерстяной фабрике. Потом изменила то, как учат: от школьных классов до залов, где её слушали менеджеры British Gas, Volkswagen и Королевской прокуратуры.</p>'+
      '</div>'+
    '</div>'+
    '<div class="tiles">'+
      '<div class="tile"><b>5</b><span>лет на ткацкой фабрике</span></div>'+
      '<div class="tile"><b>35</b><span>лет преподавала в университете</span></div>'+
      '<div class="tile"><b>100</b><span>лет со дня рождения в 2026-м</span></div>'+
    '</div>'+
    '<button class="btn" id="go">Что о ней говорили</button>'+
  '</section>');
  $('#go').onclick=clips;
}

/* ---------- Слайд 2: вырезки и выбор теста ---------- */
function clips(){
  TOP.hidden=true;paint(2);
  var n1=TESTS.fun.list.length,n2=TESTS.pro.list.length;
  put('<section class="card">'+
    '<p class="eyebrow">Вырезки</p>'+
    '<h2>Что о ней писали и говорили</h2>'+
    '<div class="clips">'+CLIPS.map(function(c){
      return '<figure class="clip"><q>'+c.q+'</q><figcaption><cite>'+c.c+'</cite></figcaption></figure>';
    }).join('')+'</div>'+
    '<p class="src" style="color:var(--ink)">Цитаты даны в нашем переводе, источники указаны в конце.</p>'+
    '<h3 class="choose">Выберите тест</h3>'+
    '<div class="picks">'+
      '<button class="pick p1" data-t="fun"><b>Просто интересное</b><span>'+n1+' вопросов. Лёгкие, смешные, с удивительными фактами о её жизни.</span></button>'+
      '<button class="pick p2" data-t="pro"><b>Я преподаватель</b><span>'+n2+' вопросов. Биография, реальные уроки и приёмы для вашего класса.</span></button>'+
    '</div>'+
    '<p class="cnt" id="cnt" hidden></p>'+
  '</section>');
  $$('.pick').forEach(function(b){b.onclick=function(){begin(b.getAttribute('data-t'))}});
  loadCount();
}

function begin(key){
  S.key=key;S.score=0;SCORE.textContent='0';
  quiz(0);
}

/* ---------- Вопросы ---------- */
function quiz(i){
  var T=TESTS[S.key],n=T.list.length,m=T.list[i],last=i===n-1;
  TOP.hidden=false;
  FILL.style.width=Math.round((i+1)/(n+1)*100)+'%';
  POS.textContent='Вопрос '+(i+1)+' из '+n;
  paint(COLORS[i%COLORS.length]);
  var ord=shuffle(m.o.length);
  put('<section class="card">'+
    '<p class="when">'+m.when+'</p>'+
    '<p class="mot">'+mot(i,n)+'</p>'+
    '<h2>'+m.q+'</h2>'+
    '<div class="opts">'+ord.map(function(k){return '<button class="opt" data-k="'+k+'">'+m.o[k]+'</button>'}).join('')+'</div>'+
    '<div><button class="btn ghost" id="hb">Нужна подсказка?</button></div>'+
    '<div id="hint" class="hint" hidden><b>Подсказка</b>'+m.h+'</div>'+
    '<div id="fb" class="fb" hidden></div></section>');
  $('#hb').onclick=function(){$('#hint').hidden=false;$('#hb').hidden=true};
  $$('.opt').forEach(function(b){
    b.onclick=function(){
      var k=+b.getAttribute('data-k'),ok=k===m.a;
      $$('.opt').forEach(function(x){x.disabled=true;if(+x.getAttribute('data-k')===m.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      if(ok)add(1);
      $('#hb').hidden=true;
      var fb=$('#fb');fb.hidden=false;
      fb.innerHTML='<p><strong>'+(ok?OK[i%OK.length]:'Не совсем.')+'</strong>'+(ok?'':' Правильный ответ: '+lc(m.o[m.a])+'.')+'</p>'+
        '<div class="fact"><b>Что дальше</b>'+m.f+'</div>'+
        (m.u?'<div class="use"><b>Для урока РКИ</b>'+m.u+'</div>':'')+
        '<button class="btn" id="nx">'+(last?'Узнать результат':'Дальше (осталось '+(n-i-1)+')')+'</button>';
      $('#nx').onclick=function(){last?finale():quiz(i+1)};
      $('#nx').focus();
    };
  });
}

/* ---------- Финал ---------- */
function finale(){
  var T=TESTS[S.key],n=T.list.length,s=S.score,r=s/n;
  TOP.hidden=false;FILL.style.width='100%';POS.textContent='Готово';paint(0);
  var title=r>=0.85?'Эксперт с мантией':(r>=0.5?'Опытный сотрудник бюро':'Стажёр бюро');
  var praise=r>=0.85?'Блестяще! Теперь вы можете сами рассказывать о Хитхоут.':(r>=0.5?'Отличный результат: вы уже знаете о ней главное.':'Каждая ошибка принесла вам новый факт, а так она и учила: через задачи.');
  var other=S.key==='fun'?'pro':'fun';
  var txt='Я прошёл(а) тест «'+T.name+'» о Дороти Хитхоут и набрал(а) '+s+' из '+n+': '+title+'. Узнать больше о ней и о методике РКИ: '+SITE;
  put('<section class="card">'+
    '<p class="eyebrow">Диплом бюро</p>'+
    '<h2>Вы прошли весь тест</h2>'+
    '<div class="big-score">'+s+'<small> из '+n+'</small></div>'+
    '<div class="title-badge">'+title+'</div>'+
    '<p class="praise">'+praise+'</p>'+
    '<div class="fact"><b>Напоследок</b>'+T.prize.t+'</div>'+
    '<blockquote class="quote">'+T.prize.q+'<cite>'+T.prize.c+'</cite></blockquote>'+
    '<div class="promo">'+
      '<h3>Проект «Лингва-полка»</h3>'+
      '<p>Игры и онлайн-курс для преподавателей русского как иностранного. Следующий поток курса стартует 24 октября.</p>'+
      '<div class="row"><a class="btn" href="'+TG+'" target="_blank" rel="noopener">Подписаться на Telegram</a><a class="btn alt" href="'+SITE+'" target="_blank" rel="noopener">lingvapolka.ru</a></div>'+
    '</div>'+
    '<div class="row"><button class="btn ghost" id="cp">Скопировать результат</button><button class="btn ghost" id="other">Пройти тест «'+TESTS[other].name+'»</button><button class="btn ghost" id="again">Ещё раз</button></div>'+
    '<textarea class="share" id="share" readonly aria-label="Текст для публикации" hidden>'+txt+'</textarea>'+
    '<p class="src" id="cpmsg" role="status"></p>'+
    '<p class="cnt" id="cnt" hidden></p>'+
    '<p class="src">Источники: Heathcote D., Bolton G. Drama for Learning, 1995; Heathcote D., Contexts for Active Learning (NATD, 2002); National Drama; ArtsPraxis 13(1); некрологи Times Educational Supplement и The Stage; Creative New Zealand; Википедия; CODE; Drama Resource; Unfinished Histories.</p>'+
  '</section>');
  $('#again').onclick=function(){begin(S.key)};
  reportDone(S.key);
  $('#other').onclick=function(){begin(other)};
  $('#cp').onclick=function(){
    var ta=$('#share'),msg=$('#cpmsg');
    function fallback(){ta.hidden=false;ta.focus();ta.select();msg.textContent='Текст выделен: скопируйте его вручную.'}
    try{navigator.clipboard.writeText(txt).then(function(){msg.textContent='Скопировано.'},fallback)}catch(e){fallback()}
  };
}

intro();
})();
